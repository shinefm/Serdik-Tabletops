function cardSel(c){return `[data-act="card"][data-tier="${c.tier}"][data-slot="${c.slot}"]`;}
function rigBank(c,n){const st=gSt();if(st.bank[c]>=n)return;const bot=st.players.find(p=>p.bot);while(st.bank[c]<n&&bot&&bot.t[c]>0){bot.t[c]--;st.bank[c]++;}if(st.bank[c]<n)st.bank[c]=n;}
function rigAffordClassic(g){
  const st=gSt(),me=gMe(),b=bonusOf(me);
  let k=0,best=1e9;st.market.t1.forEach((id,i)=>{if(!id)return;const tot=Object.values(CARDS[id].cost).reduce((a,x)=>a+x,0);if(tot<best){best=tot;k=i;}});
  const c=CARDS[st.market.t1[k]];
  for(const col in c.cost){let need=c.cost[col]-(b[col]||0)-me.t[col];while(need>0){if(st.bank[col]>0)st.bank[col]--;me.t[col]++;need--;}}
  let over=tokTotal(me)-MAXTOK;for(const col of COLORS){while(over>0&&me.t[col]>0&&!(c.cost[col]>0)){me.t[col]--;st.bank[col]++;over--;}}
  g.card={tier:1,slot:k};
}
function dPut(st,i,tk){ // place token tk at cell i, taking it from the bag if possible
  const j=st.bag.indexOf(tk);if(j>=0)st.bag.splice(j,1);
  if(st.board[i])st.bag.push(st.board[i]);st.board[i]=tk;
}
function rigDiag(g){
  const st=gSt(),ok=L=>L.every(i=>st.board[i]&&st.board[i]!=='y');
  let L=DLINES.find(L=>L.length===3&&(L[1]-L[0]===6||L[1]-L[0]===4)&&ok(L));
  if(!L){L=[6,12,18];['w','u','g'].forEach((c,k)=>{if(!st.board[L[k]]||st.board[L[k]]==='y')dPut(st,L[k],c);});}
  g.cells=L;ui.dsel=[];ui.dpriv=false;
}
function rigPriv(g){const st=gSt(),me=gMe();if(me.priv<1){if(st.privSupply>0)st.privSupply--;else st.players[1-cur.human].priv=Math.max(0,st.players[1-cur.human].priv-1);me.priv++;}
  let i=st.board.findIndex(x=>x==='p');if(i<0)i=st.board.findIndex(x=>x&&x!=='y');g.pc=i;ui.dsel=[];ui.dpriv=false;}
function rigAffordDuel(g){
  const st=gSt(),me=gMe(),b=bonusOf(me);let pick=null;
  for(const t of [1,2])st.market['t'+t].forEach((id,k)=>{if(!pick&&id&&!CARDS[id].wild&&(CARDS[id].ab||CARDS[id].crowns))pick={tier:t,slot:k};});
  if(!pick){const k=st.market.t1.findIndex(id=>id&&!CARDS[id].wild);pick={tier:1,slot:Math.max(0,k)};}
  const c=CARDS[st.market['t'+pick.tier][pick.slot]];
  for(const col in c.cost){let need=c.cost[col]-(b[col]||0)-(me.t[col]||0);while(need>0){const i=st.board.findIndex(x=>x===col);if(i>=0)st.board[i]=null;else{const j=st.bag.indexOf(col);if(j>=0)st.bag.splice(j,1);else{const o=st.players[1-cur.human];if(o.t[col]>0)o.t[col]--;}}me.t[col]=(me.t[col]||0)+1;need--;}}
  g.card=pick;
}

function endGuide(msg){ui.guide=null;clearInterval(guideTimer);const o=$('#gd');if(o)o.remove();if(msg)toast(msg);}
function guideAdvance(){const g=ui.guide;if(!g)return;const step=g.steps[g.i];if(step&&step.last){endGuide('Main terus — tombol ← di atas membawamu kembali ke '+guideDest());return;}g.i++;g.entered=-1;g.drawn=null;guideTick();}
function guideTick(){
  const g=ui.guide;
  if(!g||!cur||!cur.local||!cur.guided||view!=='table'){if(g&&(!cur||!cur.guided||view!=='table'))endGuide();return;}
  const st=cur.st,step=g.steps[g.i];if(!step){endGuide();return;}
  const myT=st.status==='playing'&&st.turn===cur.human;
  if(st.status==='ended'){endGuide('Permainan selesai!');return;}
  if(step.wait){if(myT&&!modalOpen()){g.i++;g.entered=-1;g.drawn=null;return guideTick();}return drawGuide({t:'Giliran lawan',x:'🤖 Bot sedang jalan. Tunggu sebentar…'},[],true);}
  if(step.turn&&!myT)return drawGuide({t:'Giliran lawan',x:'🤖 Bot sedang jalan. Tunggu sebentar…'},[],true);
  if(g.entered!==g.i){g.entered=g.i;g.mark=hLog();g.scrolled=false;if(step.setup){step.setup(g);render();}}
  if(step.done&&step.done(g)){g.i++;g.entered=-1;g.drawn=null;return guideTick();}
  drawGuide(step,step.sel?step.sel(g):[]);
}
function drawGuide(step,sels,waiting){
  const g=ui.guide;let o=$('#gd');
  if(!o){o=document.createElement('div');o.id='gd';document.body.appendChild(o);}
  const els=[];sels.forEach(sel=>{document.querySelectorAll(sel).forEach((e,k)=>{if(k===0||sel.startsWith('.dcell')||sel.includes('patron'))els.push(e);});});
  if(els.length&&!g.scrolled&&!waiting){g.scrolled=true;const r=els[0].getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-150)els[0].scrollIntoView({block:'center',behavior:'smooth'});}
  const rects=els.map(e=>e.getBoundingClientRect()).filter(r=>r.width>0);
  const lowTarget=rects.length&&(rects[0].top+rects[0].height/2)>innerHeight*0.55;
  const total=g.steps.filter(s=>!s.wait).length, num=g.steps.slice(0,g.i+1).filter(s=>!s.wait).length;
  const key=g.i+'|'+(waiting?'w':'a')+'|'+lowTarget;
  if(g.drawn!==key){g.drawn=key;
    o.innerHTML=`<div class="gcap ${lowTarget?'top':''}" id="gcap"><div class="gh"><span class="gstep">${waiting?'⏳':'🧭 '+num+'/'+total}</span><b>${step.t}</b></div><div class="gx">${step.x}</div>
      <div class="gb">${step.last?`<button class="btn pri sm gbtn" data-act="guidehome">← Kembali ke ${guideDest()}</button><button class="btn sm gbtn" data-act="guidenext">Main terus di sini</button>`:`${step.next?`<button class="btn pri sm gbtn" data-act="guidenext">Lanjut →</button>`:''}<button class="btn sm gbtn" data-act="guidequit">Keluar panduan</button>`}</div></div><div id="grings"></div>`;}
  $('#grings').innerHTML=rects.map(r=>`<div class="gring" style="left:${r.left-5}px;top:${r.top-5}px;width:${r.width+10}px;height:${r.height+10}px"></div>`).join('');
}
document.addEventListener('click',e=>{

function rapatPending(st){
  if(st.status!=='playing')return [];
  if(st.game==='sandi')return st.players.map((p,i)=>i).filter(i=>st.players[i].team===st.turnTeam&&(st.phase==='clue'?!!st.players[i].ketua:!st.players[i].ketua));
  if(st.game==='werewolf')return st.players.map((p,i)=>i).filter(i=>!(st.phase==='night'?st.done:st.voted).includes(i));
  if(st.game==='wwk'){if(st.phase==='hunter')return [st.hunter.p];return st.players.map((p,i)=>i).filter(i=>st.alive[i]&&(st.phase==='night'?!st.done.includes(i):st.votes[i]==null));}
  if(st.phase==='propose')return [st.leader];
  if(st.phase==='vote')return st.players.map((p,i)=>i).filter(i=>st.votes[i]==null);
  if(st.phase==='mission')return st.team.filter(i=>!st.played.includes(i));
  if(st.phase==='shoot')return [rapatRoles(st).indexOf('D')];
  return [];
}

  const key=sandiKey(st), T=st.turnTeam, isK=!!(me&&me.ketua);
  const spy=ended||(isK&&ui.sdKey!==false);
  const myTurn=!ended&&me&&me.team===T&&canWrite!==false&&!st.paused;
  const canClue=myTurn&&isK&&st.phase==='clue', canGuess=myTurn&&!isK&&st.phase==='guess';
  const sk=st.round+':'+T+':'+st.phase+':'+st.rev.filter(Boolean).length; if(ui.sdSK!==sk){ui.sdSK=sk;ui.sdSel=null;}
  const oneMk=new Set(st.words.map(x=>x.mk)).size===1;
  const cards=st.words.map((ref,i)=>{const w=termOf(ref), r=st.rev[i];
    const cls=r?`rev c-${r.c}`:spy?`spy c-${key[i]}`:'';

    const lg=Math.max(...w.w.split(/\s+/).map(x=>x.length))>=10?'long':'';
    return `<button class="sdcard ${cls} ${sel} ${pick} ${lg}" data-act="sdcard" data-i="${i}">${oneMk?'':`<span class="sdmk" style="--mk:${sdMkColor(ref.mk)}">${ref.mk}</span>`}<span class="sdw">${esc(w.w)}</span>${spy&&!r&&key[i]==='x'?'<span class="sdx">💥</span>':''}${by}</button>`;}).join('');
  const left=t=>sandiLeft(st,t), Tn=t=>'Tim '+TEAMNAME[t];

  let head, act='';

    act=`<div>${esc(st.winBy||'')}.</div><div class="bd">Semua warna kartu kini terbuka di papan. Ketuk kartu untuk membaca arti istilahnya.</div><button class="btn pri" data-act="showend">Lihat hasil</button>`;}
  else if(st.phase==='clue'){head=`🎖️ <b>${Tn(T)}</b> · ketua ${kName(T)} menyiapkan petunjuk`;
    if(canClue){const wv=esc(ui.sdW||''), nv=ui.sdN||1;
      act=`<div><b>Giliranmu memberi petunjuk.</b> Kartu timmu yang belum terbuka: <b>${left(T)}</b> (bergaris ${T==='r'?'merah':'biru'}). Hindari kartu 💥 Audit.</div>
        <div class="sdclue-in"><input id="sdW" maxlength="24" placeholder="Satu kata petunjuk" value="${wv}" autocomplete="off" oninput="ui.sdW=this.value" onfocus="ui.sdFoc=1" onblur="ui.sdFoc=0">
        <select id="sdN" class="ordsel" onchange="ui.sdN=+this.value">${[1,2,3,4,5,6,7,8,9].map(k=>`<option value="${k}" ${k===nv?'selected':''}>${k}</option>`).join('')}</select>

    else if(me&&me.team===T)act=`<div>Tunggu ketua timmu (<b>${kName(T)}</b>) memberi petunjuk.</div>`;

  else{const c=st.clue, used=c.n+1-st.left;

    const big=`<div class="sdbig sd-${T}">“${esc(c.w)}” <span>${c.n}</span></div>`;

      act=big+`<div>Sisa tebakan: <b>${st.left}</b> (maks. angka + 1). Salah tebak langsung mengakhiri giliran.</div>`

    else if(isK&&me.team===T)act=big+`<div>Timmu sedang menebak (${used} kartu dibuka). Ketua dilarang memberi isyarat 🤐</div>`;
    else if(me&&me.team===T)act=big+'<div>Timmu sedang menebak.</div>';

  const teamBox=t=>{const m=sdTeamNames(st,t);

      <div class="sdmem">${m.map(i=>`<span class="${i===mi?'me':''}"><span class="dot ${ONLINE.has(st.players[i].id)?'on':''}"></span>${st.players[i].ketua?'🎖️':''}${esc(nm(st,i))}</span>`).join('')}</div>
      <div class="sdcl">${(st.clues||[]).filter(c=>c.t===t).map(c=>`<span>“${esc(c.w)}” ${c.n}</span>`).join('')||'<span class="mute">Belum ada petunjuk</span>'}</div></div>`;};
  const logs=st.log.slice(-14).reverse().map(l=>`<div>${l.p>=0?`<b>${esc(nm(st,l.p))}</b> `:''}${esc(l.m)}</div>`).join('');
  $('#app').innerHTML=`<div class="sd-wrap">
    <section class="panel">
      <div class="turnbar"><div class="who"><span class="pill playing" style="margin:0 6px 0 0">🕵️ SANDI</span>${head}${timerHTML(st)}</div>
        <div class="row" style="gap:6px">${isK&&!ended?`<button class="btn sm" data-act="sdkey">${spy?'🙈 Sembunyikan kunci':'👁 Lihat kunci'}</button>`:mi<0?'<span class="bd">👀 Menonton</span>':''}<button class="btn sm" data-act="tutorial" data-w="sandi">📖</button></div></div>
      <div class="sdteams">${teamBox('r')}${teamBox('b')}</div>
    </section>
    <section class="panel ract sdact">${act}</section>
    <section class="panel"><div class="sdboard">${cards}</div>
      <div class="sdlegend bd">${spy&&!ended?'Kamu ketua: kartu bergaris menunjukkan kunci (🔴 Merah, 🔵 Biru, ⬜ netral, 💥 Audit). Hanya ketua yang melihatnya.':'Ketuk kartu yang sudah terbuka untuk membaca arti istilahnya.'}</div></section>
    <details class="panel log" ${ui.logOpen?'open':''} ontoggle="ui.logOpen=this.open"><summary style="font-family:Fraunces,serif;font-weight:600;font-size:15px;cursor:pointer">Catatan permainan</summary>${logs}</details>
  </div>`;
  if(ui.sdFoc){const x=$('#sdW');if(x){x.focus();const L=x.value.length;try{x.setSelectionRange(L,L);}catch(e){}}}
  if(!ended&&mi>=0){ui.sdRoleShown=ui.sdRoleShown||{};if(!ui.sdRoleShown[cur.gid]){ui.sdRoleShown[cur.gid]=true;setTimeout(()=>{if(cur&&cur.st&&cur.st.game==='sandi'&&cur.st.status==='playing'&&!modalOpen())sdRoleModal();},400);}}
  maybeEndPopup(st);
}

function sdClick(i){

async function hubMove(mv){
  if(ui.busy)return; const st=cur.st, mi=meIdx(st);
  if(mi<0||canWrite===false)return toast('Kamu sedang menonton meja ini');
  try{hubAct(clone(st),mi,mv);}catch(e){return toast(e.message);}
  ui.busy=true; closeModal();
  try{await commitOnline(s=>{const k=meIdx(s);if(k<0)fail('Kamu bukan pemain meja ini');hubAct(s,k,mv);});}
  catch(e){if(!e.noop)toast(e.message||'Gagal menyimpan, coba lagi');}
  finally{ui.busy=false;}
}
function hubNotify(prev,d){
  if(!prev||prev.status!=='playing'||!isHubGame(d))return;
  if(d.game==='sandi'){const mi=meIdx(d),me=mi>=0?d.players[mi]:null;
    if(d.status!=='playing')return;
    if(d.phase==='guess'&&prev.phase!=='guess'&&d.clue){if(me&&me.team===d.turnTeam&&!me.ketua)rankPop('up','🔍',`“${d.clue.w}” · ${d.clue.n}`,'Petunjuk dari ketua · giliran timmu menebak',2800);else toast(`🕵️ Tim ${TEAMNAME[d.turnTeam]}: “${d.clue.w}” · ${d.clue.n}`);}
    else if(d.turnTeam!==prev.turnTeam&&me&&me.team===d.turnTeam&&me.ketua)rankPop('up','🎖️','Giliranmu memberi petunjuk','Lihat kunci, lalu kirim satu kata + angka',2600);
    const L=d.log[d.log.length-1];if(L&&d.log.length>prev.log.length&&L.p>=0&&L.p!==mi&&/membuka/.test(L.m))toast(nm(d,L.p)+' '+L.m);
    return;}
  if(d.game==='jualan'){const me=meIdx(d),t=me>=0?d.players[me].team:-1;
    if(prev.phase==='plan'&&d.phase==='sell')rankPop('up','🛒','Fase jualan!','Urutan: '+d.order.map(i=>d.teams[i].name).join(' → '),3200);
    else if(d.phase==='sell'&&t>=0&&d.order[d.si]===t&&(prev.phase!=='sell'||prev.order[prev.si]!==t)&&jyCan(d,me,t,'sl'))rankPop('up','🛒','Giliran jualan timmu!','Pilih kotak demand yang mau diincar',2600);
    if(d.draw&&(!prev.draw||prev.draw.n!==d.draw.n)&&d.draw.t!==t){const D=d.draw;toast(`${d.teams[D.t].name}: ${JY.QN[D.q]} ${JY.PN[D.p]} → ${D.ok?'laku '+D.units:'gagal'}`);}

function wwChronicle(st){

function pmBoardSVG(st,me,mode){
  const s=48, G=PM_G, B=st.board, X=x=>(x*s).toFixed(1), parts=[];

  let vOk=[],eOk=[],hOk=[];
  if(myTurn){
    if(st.phase==='setup'){if(st.setup.need==='S')vOk=pmSettleSpots(st,me,true);else eOk=PM_G.verts[st.setup.v].e.filter(e=>st.edge[e]==null);}
    else if(st.phase==='robber')hOk=[...Array(19).keys()].filter(h=>h!==B.robber);
    else if(st.phase==='freeroad'||mode==='road')eOk=pmRoadSpots(st,me);

    else if(mode==='city')vOk=pmCitySpots(st,me);

  B.ports.forEach(pt=>{const E=G.edges[pt.e],A=G.verts[E.a],C=G.verts[E.b],mx=(A.x+C.x)/2,my=(A.y+C.y)/2,l=Math.hypot(mx,my),px=mx+mx/l*0.62,py=my+my/l*0.62;
    parts.push(`<line x1="${X(A.x)}" y1="${X(A.y)}" x2="${X(px)}" y2="${X(py)}" stroke="#e9dcc0" stroke-width="3" stroke-dasharray="3 3"/><line x1="${X(C.x)}" y1="${X(C.y)}" x2="${X(px)}" y2="${X(py)}" stroke="#e9dcc0" stroke-width="3" stroke-dasharray="3 3"/>`);
    parts.push(`<g><circle cx="${X(px)}" cy="${X(py)}" r="17" fill="#f6ecd2" stroke="#7a5a2a" stroke-width="2"/><text x="${X(px)}" y="${(py*s-2).toFixed(1)}" text-anchor="middle" font-size="${pt.t==='any'?11:13}">${pt.t==='any'?'❓':PM_RI[pt.t]}</text><text x="${X(px)}" y="${(py*s+11).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#4a3412">${pt.t==='any'?'3:1':'2:1'}</text></g>`);});
  B.hex.forEach((h,i)=>{const pts=G.hv[i].map(v=>X(G.verts[v].x)+','+X(G.verts[v].y)).join(' '), [cx,cy]=G.center[i], hl=hOk.includes(i);
    parts.push(`<polygon points="${pts}" fill="${PM_TCOL[h.t]}" stroke="#f3e6c4" stroke-width="2.5" ${hl?`class="pmhl" data-act="pmh" data-h="${i}"`:''}/>`);
    parts.push(`<text x="${X(cx)}" y="${(cy*s-14).toFixed(1)}" text-anchor="middle" font-size="19" pointer-events="none">${PM_TEMO[h.t]}</text>`);
    if(h.n){const hot=h.n===6||h.n===8, pip=PM_PIPS[h.n];
      parts.push(`<g pointer-events="none" opacity="${i===B.robber?0.45:1}"><circle cx="${X(cx)}" cy="${(cy*s+10).toFixed(1)}" r="14" fill="#f8f0da" stroke="#6b5a3a" stroke-width="1.5"/><text x="${X(cx)}" y="${(cy*s+14).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="${hot?'#c0262f':'#2a2216'}">${h.n}</text>
        ${[...Array(pip)].map((_,k)=>`<circle cx="${(cx*s+(k-(pip-1)/2)*3.6).toFixed(1)}" cy="${(cy*s+19.5).toFixed(1)}" r="1.2" fill="${hot?'#c0262f':'#2a2216'}"/>`).join('')}</g>`);}
    if(i===B.robber)parts.push(`<text x="${(cx*s+(h.n?20:0)).toFixed(1)}" y="${(cy*s+(h.n?17:12)).toFixed(1)}" text-anchor="middle" font-size="${h.n?20:26}" pointer-events="none">🦹</text>`);
  });
  st.edge.forEach((p,e)=>{if(p==null)return;const E=G.edges[e],A=G.verts[E.a],C=G.verts[E.b];
    parts.push(`<line x1="${X(A.x)}" y1="${X(A.y)}" x2="${X(C.x)}" y2="${X(C.y)}" stroke="#1b1b1b" stroke-width="9" stroke-linecap="round"/><line x1="${X(A.x)}" y1="${X(A.y)}" x2="${X(C.x)}" y2="${X(C.y)}" stroke="${PM_COL[p]}" stroke-width="6" stroke-linecap="round"/>`);});
  eOk.forEach(e=>{const E=G.edges[e],A=G.verts[E.a],C=G.verts[E.b],c=`x1="${X(A.x)}" y1="${X(A.y)}" x2="${X(C.x)}" y2="${X(C.y)}"`;parts.push(`<line class="pmspot" ${c} stroke="#1b1b1b" stroke-width="11" stroke-linecap="round" opacity=".55"/><line class="pmspot" ${c} stroke="#ffd84d" stroke-width="7" stroke-linecap="round"/><line class="pmhit" data-act="pme" data-e="${e}" ${c} stroke="transparent" stroke-width="22"/>`);});
  st.vtx.forEach((b,v)=>{if(!b)return;const V=G.verts[v],x=V.x*s,y=V.y*s,c=PM_COL[b.p];
    parts.push(b.c?`<path d="M${x-11},${y+8} v-11 l6,-6 l6,6 v-4 h10 v15 z" fill="${c}" stroke="#1b1b1b" stroke-width="2"/>`:`<path d="M${x-8},${y+7} v-8 l8,-7 l8,7 v8 z" fill="${c}" stroke="#1b1b1b" stroke-width="2"/>`);});

  return `<svg class="pmboard" viewBox="${-5.05*s} ${-4.6*s} ${10.1*s} ${9.2*s}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

function pmBotNext(st){

  if(st.offer){const j=st.players.findIndex((p,j)=>AB(p)&&j!==st.offer.from&&st.offer.resp[j]==null);if(j>=0)return {j,mv:pmBotRespond(st,j,st.players[j].level||'normal')};}

  return null;
}
function pmApplyBot(s,j,mv){

    pmAct(s,j,fb);}
}

function pmTimeoutMove(st,j){

function wkMine(st,mi){ // informasi rahasia untuk pemain mi

  if(r==='M'){const o=R.map((x,i)=>x==='W'?i:-1).filter(i=>i>=0);L.push('😈 Serigala: '+o.map(i=>who(i)+(st.alive[i]?'':' ☠️')).join(', '));}
  if(r==='S'){H.filter(h=>h.seer&&h.seer.p===mi).forEach(h=>L.push(`🔮 Malam ${h.night}: ${who(h.seer.t)} ${h.seer.wolf?'<b style="color:var(--bad)">SERIGALA</b>':'bukan serigala'}`));
    const a=wwGet(st,'ak')[mi];if(st.phase!=='night'||!a||a.t==null){}else L.push(`🔮 Malam ini: ${who(a.t)} ${R[a.t]==='W'?'<b style="color:var(--bad)">SERIGALA</b>':'bukan serigala'}`);}

  return L;
}

function jyCube(q,cls){return `<span class="jycube q${q} ${cls||''}" title="${JY.QN[q]}"></span>`;}

function jyCoin(cls){return `<span class="jycoin ${cls||''}">Rp</span>`;}
function jyEmpTot(emp,d,sm){
  const cur_=[emp[0]-(d?d.u12:0),emp[1]-(d?d.u23:0),emp[2]], add=d?[d.h0,d.h1+d.u12,d.h2+d.u23]:[0,0,0], c=sm?'sm':'';
  const out=[1,2,3].map(l=>jyRepeat(Math.max(0,cur_[l-1]),jyPerson(l,c),sm?6:10)+jyRepeat(add[l-1],jyPerson(l,c+' new'),sm?6:10)).join('');
  return out||'<span class="jynone">belum ada</span>';
}
function jyInvTot(inv,d,sm){const c=sm?'sm':'';
  const out=['L','M','H'].map(q=>jyRepeat(inv[q],jyCube(q,c),sm?6:10)+jyRepeat(d?d[q]:0,jyCube(q,c+' new'),sm?6:10)).join('');
  return out||'<span class="jynone">kosong</span>';
}
function jyRows(T,d){
  const e=[T.emp[0]+(d?d.h0-d.u12:0),T.emp[1]+(d?d.h1+d.u12-d.u23:0),T.emp[2]+(d?d.h2+d.u23:0)], v={H:T.inv.H+(d?d.H:0),M:T.inv.M+(d?d.M:0),L:T.inv.L+(d?d.L:0)};
  const cnt=(n,unit,parts)=>`<span class="jycnt"><b>${n}</b> ${unit}${n?` <small>${parts}</small>`:''}</span>`;
  return {hr:['👥 SDM',jyEmpTot(T.emp,d),'',cnt(e[0]+e[1]+e[2],'orang',`L1 ${e[0]} · L2 ${e[1]} · L3 ${e[2]}`)],
    op:['📦 Produksi',jyInvTot(T.inv,d),'',cnt(v.H+v.M+v.L,'barang',`E ${v.L} · S ${v.M} · P ${v.H}`)],
    mk:['❤️ CR',jyRepeat(T.cr,jyHeart(),12)+jyRepeat(d?d.cr:0,jyHeart('new'),12)||'<span class="jynone">0</span>',`<b class="jynum">${T.cr+(d?d.cr:0)}</b>`],
    sl:['🪙 Dana jualan',jyRepeat(T.bud.sl/50,jyCoin(),12)+jyRepeat(d?d.sl/50:0,jyCoin('new'),12)||'<span class="jynone">0</span>',`<b class="jynum">${jyRp(T.bud.sl+(d?d.sl:0))}</b>`]};
}
function jyCashHTML(T,d){
  if(!d)return `<div class="jycash"><small>Kas keuangan</small><b>${jyRp(T.cash)}</b></div>`;
  const C=jyDraftCost(d), room=Math.min(JY.CAP,T.cash)-C.tot;
  return `<div class="jycash ${room<0?'over':''}"><small>Sisa jatah belanja ronde ini</small><b>${jyRp(room)}</b>${C.tot?`<span class="jyminus">−${jyRp(C.tot)} belanja ronde ini</span>`:''}</div>`;}
function jyBoardHTML(T,d,cashOnly){
  if(cashOnly)return jyCashHTML(T,d);
  const R=jyRows(T,d);
  return `<div class="jyboard">${jyCashHTML(T,d)}${['hr','op','mk','sl'].map(k=>`<div class="jyrow"><span class="jyrl">${R[k][0]}${R[k][3]?'<br>'+R[k][3]:''}</span><div class="jytot">${R[k][1]}${R[k][2]}</div></div>`).join('')}</div>`;
}
function jyItem(k,icon,name,price,v,dis,maxed,sub,unit){

    <div class="jysb"><button class="btn sm" data-act="jyinc" data-k="${k}" data-d="-1" ${dis||v<=0?'disabled':''} aria-label="Kurangi ${name}">−</button><span>${k==='sl'?jyRp(v):v}</span><button class="btn sm" data-act="jyinc" data-k="${k}" data-d="1" ${dis||maxed?'disabled':''} aria-label="Tambah ${name}">+</button></div>${unit&&k!=='sl'?`<em class="jysub ${v?'on':''}">${v?v+' × '+unit+' = <b>'+jyRp(v*unit)+'</b>':'&nbsp;'}</em>`:''}</div>`;
}

function jySellPanel(st,t,me){
  const cur_t=st.order[st.si], T=st.teams[t], myTurn=t===cur_t, can=me>=0&&myTurn&&jyCan(st,me,t,'sl'), F=jyForm(st);

  if(can){const c=F.cell;
    if(c&&(st.demand[c.q][c.p]<=0||T.inv[c.q]<=0||jyElig(T,c.q,c.p)<=0))F.cell=null;
    if(!F.cell)form=`<p class="jyhelp">👆 Ketuk kotak demand di atas yang mau kamu incar. Kotak redup = stok, karyawan, atau demand tidak cukup.</p>`;

      const opts=[0,2,4].map(k=>{const cost=JY.FEE[p]+k/2*JY.SOLD2;return `<button class="btn sm ${F.k===k?'on':''}" data-act="jyk" data-k="${k}" ${cost>T.bud.sl?'disabled':''}>${k?`+${k} pasti`:'Tanpa'}<small>${Math.round(jyChance(q,p,k)*100)}% · ${jyRp(cost)}</small></button>`;}).join('');
      const cost=JY.FEE[p]+F.k/2*JY.SOLD2;
      form=`<div class="jysel"><div><b>${JY.QN[q]} · ${JY.PN[p]}</b> — kalau laku: <b>${units}</b> barang × ${jyRp(JY.REV[q][p])} = <b>${jyRp(units*JY.REV[q][p])}</b></div>

    else{const k=st.order.indexOf(t);stt=k<st.si?'✔ selesai':k===st.si?'🛒 jualan':'⏳ antre';}

function renderJualan(){

    watchTable(gid);}
  else if(!lobbyUnsub||ui.lobbyErr){try{if(lobbyUnsub)lobbyUnsub();}catch(e){}lobbyUnsub=null;subscribeLobby();}
  if(room)room.presence({uid:myId,g:cur&&!cur.local?cur.gid:null}).catch(()=>{});
}

(async function boot(){
  setMode(ui.mode);
  render();
  if(EDITION==='latihan'){online='off';const pb=$('#profBtn');if(pb){pb.style.display='';pb.innerHTML='👤 <span class="lbl">Tamu</span>';}render();return;}
  if(!window.claude||typeof window.claude.use!=='function'){
    // capabilities may arrive late; wait briefly
    await sleep(1500);
    if(!window.claude||typeof window.claude.use!=='function'){online='off';render();return;}
  }
  const safe=p=>Promise.resolve(p).catch(()=>null);
  const [d,u,r]=await Promise.all([safe(claude.use('db')),safe(claude.use('user')),safe(claude.use('room'))]);
  db=d; userApi=u; room=r;
  if(u){ try{myId=await u.id();}catch(e){} try{canWrite=await u.can('data.write');}catch(e){} try{isOwnerFlag=await u.isOwner();}catch(e){} try{ui.email=await u.email();}catch(e){ui.email=null;} }
  if(!db||!myId){online='off';render();return;}
  online='on'; render();
  ['#histBtn','#lbBtn','#profBtn'].forEach(q=>{const b=$(q);if(b)b.style.display='';});
  if(isGuest()){const b=$('#profBtn');if(b)b.innerHTML='👤 <span class="lbl">Tamu</span>';const h=$('#histBtn');if(h)h.style.display='none';}
  if(!(location.hash||'').startsWith('#meja-'))subscribeLobby(); setupRoom(); handleHash();
})();
</script>
